# Phi device profile
#
# Copy to config/devices/<codename>.conf and fill this in from an existing
# working port (postmarketOS' deviceinfo is the best source) plus one look at
# the stock boot image:
#
#   unpack_bootimg --boot_img stock-boot.img
#
# Every value below is device-specific. Guessing one of them means a device
# that hangs with no output.

# Fastboot product string, used to refuse flashing the wrong board.
# Read it with:  fastboot getvar product
PHI_FASTBOOT_PRODUCT=""

# Android boot image header version.
#   v0/v1/v2 -> kernel + appended dtb live in boot.img
#   v3/v4    -> dtb lives in vendor_boot.img; boot.img is kernel+ramdisk only
# Confirm with unpack_bootimg, do not guess.
PHI_HEADER_VERSION="2"

PHI_PAGESIZE="2048"

# Early console. This is the only way to see why a phone port fails to boot;
# on most Qualcomm devices it is ttyMSM0, on MediaTek ttyS0.
PHI_CMDLINE="console=ttyMSM0,115200n8 earlycon"

# Root filesystem, passed to the initramfs as phi.root=.
# On a phone this is usually a partition label, not a disk name.
PHI_ROOT_SPEC="/dev/disk/by-partlabel/userdata"

# Optional: dtb path under build/dtb/ for the boot image (v2 only).
PHI_DTB=""

# Set to "disabled" only if the port documents that AVB must be disabled.
# Wrong values here are the most common cause of a boot loop on first flash.
PHI_VERITY=""
