# OnePlus 6 / 6T (sdm845) -- Phi reference port TEMPLATE
#
# Status: UNVERIFIED. This is a starting point, not a working config.
# sdm845 is one of the best-supported mainline Android phone platforms, which
# is why it is the recommended first target. Verify every value below against
# a known-good postmarketOS build before flashing:
#
#   pmbootstrap init        # device: oneplus-enchilada
#   pmbootstrap install
#   unpack_bootimg --boot_img <pmos boot.img>
#
# The TODO markers are exactly the things that will bite you.

PHI_FASTBOOT_PRODUCT=""          # TODO: `fastboot getvar product` on the device

PHI_HEADER_VERSION="2"           # TODO: confirm with unpack_bootimg
PHI_PAGESIZE="2048"              # TODO: confirm with unpack_bootimg

# ttyMSM0 is the sdm845 debug UART. Keep earlycon: a silent boot with no log
# is the normal symptom of a wrong dtb or a missing console.
PHI_CMDLINE="console=ttyMSM0,115200n8 earlycon panic=10"

# Phi installs into userdata, leaving the Android partitions untouched so the
# stock OS stays recoverable.
PHI_ROOT_SPEC="/dev/disk/by-partlabel/userdata"   # TODO: match your install layout

PHI_DTB=""                       # TODO: build/dtb/qcom/sdm845-oneplus-enchilada.dtb
PHI_VERITY=""                    # TODO: "disabled" only if AVB was disabled at unlock

# Notes specific to this port:
#   * DP alt mode over USB-C is the convergence risk on sdm845. Verify video
#     out on the stock OS FIRST; if the hardware does not do it, plan on
#     Wi-Fi display or a USB DisplayLink adapter instead (docs/ARCHITECTURE.md).
#   * The alert slider is a gpio-keys input; map it to a mode toggle later.
